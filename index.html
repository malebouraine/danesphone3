<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Lockscreen AU</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Material Icons untuk ikon realistis -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

    <!-- Bingkai Layar HP 6.7 Inch -->
    <div class="phone-frame-67">
        
        <!-- Samsung Status Bar -->
        <div class="samsung-status-bar">
            <span>10:16</span>
            <div class="status-right">
                <span class="material-symbols-outlined" style="font-size: 14px;">signal_cellular_alt</span>
                <span class="material-symbols-outlined" style="font-size: 14px;">wifi</span>
                <span style="font-size: 11px;">85%</span>
                <span class="material-symbols-outlined" style="font-size: 14px;">battery_full</span>
            </div>
        </div>

        <!-- Konten Lockscreen -->
        <div class="lockscreen-content">
            <!-- Ikon Gembok Atas -->
            <div class="lock-padlock">
                <span class="material-symbols-outlined">lock</span>
            </div>

            <!-- Jam Digital dengan Font Sangat Bold -->
            <div class="samsung-clock">
                <h1 class="clock-time">10:16</h1>
                <p class="clock-date">Sun, 8 November</p>
            </div>
        </div>

        <!-- Shortcut & Navigasi Bawah -->
        <div class="lockscreen-bottom">
            <div class="shortcut-btn">
                <span class="material-symbols-outlined">call</span>
            </div>
            
            <!-- Garis Navigasi Gesture One UI -->
            <div class="oneui-gesture-bar"></div>

            <div class="shortcut-btn">
                <span class="material-symbols-outlined">photo_camera</span>
            </div>
        </div>

    </div>

</body>
</html>
